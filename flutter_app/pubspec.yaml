name: workconnect
description: A job connecting app for Iran workers and employers
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core (MUST be compatible with other Firebase packages)
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_messaging: ^16.0.4
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Dependency Injection
  get_it: ^7.6.4

  # HTTP Client
  dio: ^5.3.3

  # Local Storage
  shared_preferences: ^2.2.1
  flutter_secure_storage: ^9.0.1

  # Form Validation
  formz: ^0.5.0
  
  # Security
  flutter_app_lock: ^3.0.0
  local_auth: ^2.1.7
  encrypt: ^5.0.1

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Navigation
  go_router: ^14.0.4

  # Utilities
  intl: ^0.18.1
  uuid: ^4.3.0

  # WebSocket
  web_socket_channel: ^3.0.1

  # Device Info
  device_info_plus: ^9.0.3
  package_info_plus: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  bloc_test: ^9.1.4
  mocktail: ^1.0.1
  dartz: ^0.10.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/svgs/

  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir-Regular.ttf
        - asset: assets/fonts/Vazir-Bold.ttf
          weight: 700